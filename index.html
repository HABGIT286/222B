<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2B Gaming - نظام التصويت المتقدم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs/3.3.3/fingerprint.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&family=Bungee&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #7b2cbf;
            --accent: #ff006e;
            --gold: #ffd700;
            --dark: #0a0a0a;
            --glass: rgba(10, 10, 10, 0.7);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('S.jpg');
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .clock {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .section-title {
            font-family: 'Bungee', cursive;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--gold), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Poll Section */
        .poll-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .game-card {
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(0,212,255,0.3);
        }

        .game-card.voted {
            border-color: #00ff00;
            background: rgba(0,255,0,0.1);
        }

        .game-card.most-voted {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
        }

        .game-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .game-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--gold);
        }

        .vote-bar {
            height: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        .vote-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 15px;
            transition: width 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .vote-count {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 10px;
        }

        .voters-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            display: none;
        }

        .voters-list.show {
            display: block;
        }

        .voter-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voter-item:last-child {
            border-bottom: none;
        }

        .voter-name {
            color: var(--primary);
            font-weight: 600;
        }

        .voter-time {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--glass);
            border: 2px solid var(--primary);
            border-radius: 25px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,212,255,0.5);
        }

        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--gold);
        }

        .input-field {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }

        /* Top Visitors */
        .top-visitors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .visitor-card {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .visitor-rank {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .visitor-info {
            flex: 1;
        }

        .visitor-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .visitor-stats {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }

        /* Timer */
        .countdown {
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            margin: 20px 0;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255,0,110,0.5);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0,0,0,0.95);
            border: 2px solid var(--primary);
            padding: 20px 40px;
            border-radius: 15px;
            z-index: 2000;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error { border-color: #ff0000; }
        .toast.success { border-color: #00ff00; }

        /* ========================================== */
        /* === إضافة جديدة: أنماط لوحة التحكم === */
        /* ========================================== */
        .admin-toggle-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border: 2px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-toggle-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        .admin-panel {
            display: none;
            border: 2px solid var(--accent);
        }

        .admin-panel.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .admin-form {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .admin-form label {
            font-weight: 700;
            color: var(--gold);
            text-align: right;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            font-family: 'Orbitron', monospace;
        }

        .stat-label {
            color: rgba(255,255,255,0.7);
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .poll-container { grid-template-columns: 1fr; }
            .clock { font-size: 1.8rem; }
            .section-title { font-size: 1.5rem; }
            .admin-toggle-btn { bottom: 20px; left: 20px; width: 50px; height: 50px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="font-family: 'Bungee', cursive; font-size: 3rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                2B GAMING
            </h1>
            <div class="clock" id="clock">00:00:00</div>
            <div id="dateDisplay" style="color: rgba(255,255,255,0.8); margin-top: 10px;"></div>
        </div>

        <!-- ========================================== -->
        <!-- === إضافة جديدة: لوحة التحكم (مخفية) === -->
        <!-- ========================================== -->
        <div class="glass-card admin-panel" id="adminPanel">
            <h2 class="section-title"><i class="fas fa-user-shield"></i> لوحة تحكم المسؤول</h2>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
                <!-- نموذج إضافة لعبة -->
                <div>
                    <h3 style="color: var(--gold); margin-bottom: 15px;"><i class="fas fa-plus-circle"></i> إضافة لعبة جديدة</h3>
                    <div class="admin-form">
                        <input type="text" class="input-field" id="newGameName" placeholder="اسم اللعبة">
                        <input type="text" class="input-field" id="newGameImage" placeholder="رابط صورة اللعبة (URL)">
                        <input type="text" class="input-field" id="newGameDesc" placeholder="وصف مختصر">
                        <button class="btn btn-primary" onclick="addNewGame()">
                            <i class="fas fa-save"></i> حفظ اللعبة
                        </button>
                    </div>
                </div>

                <!-- نموذج إنشاء جلسة تصويت -->
                <div>
                    <h3 style="color: var(--gold); margin-bottom: 15px;"><i class="fas fa-hourglass-start"></i> إنشاء جلسة تصويت</h3>
                    <div class="admin-form">
                        <input type="text" class="input-field" id="sessionTitle" placeholder="عنوان الجلسة (مثال: تصويت الأسبوع)">
                        <input type="text" class="input-field" id="sessionDesc" placeholder="وصف الجلسة">
                        <input type="number" class="input-field" id="sessionDays" placeholder="المدة بالأيام" value="7" min="1">
                        <button class="btn btn-primary" onclick="createNewSession()">
                            <i class="fas fa-play"></i> بدء الجلسة
                        </button>
                    </div>
                </div>
            </div>

            <!-- إحصائيات سريعة -->
            <h3 style="color: var(--gold); margin-top: 30px; margin-bottom: 15px;"><i class="fas fa-chart-line"></i> إحصائيات عامة</h3>
            <div class="stats-grid" id="adminStats">
                <div class="stat-box">
                    <div class="stat-value" id="statTotalVotes">0</div>
                    <div class="stat-label">إجمالي الأصوات</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statUniqueVoters">0</div>
                    <div class="stat-label">مصوتون فريدون</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statActiveGames">0</div>
                    <div class="stat-label">ألعاب نشطة</div>
                </div>
            </div>
        </div>

        <!-- Voting Section -->
        <div class="glass-card">
            <h2 class="section-title">
                <i class="fas fa-trophy"></i>
                نظام التصويت المتقدم
            </h2>
            
            <div class="countdown" id="countdown">
                جاري تحميل الجلسة...
            </div>

            <div class="poll-container" id="pollContainer">
                <!-- الألعاب ستُحمّل هنا -->
            </div>
        </div>

        <!-- Top Visitors Section -->
        <div class="glass-card">
            <h2 class="section-title">
                <i class="fas fa-crown"></i>
                أكثر الزوار نشاطاً
            </h2>
            <div class="top-visitors" id="topVisitors">
                <!-- سيتم ملؤها بالJavaScript -->
            </div>
        </div>
    </div>

    <!-- Vote Modal -->
    <div class="modal" id="voteModal">
        <div class="modal-content">
            <h3 class="modal-title">
                <i class="fas fa-vote-yea"></i>
                تأكيد التصويت
            </h3>
            <p style="margin-bottom: 20px; color: rgba(255,255,255,0.8);">
                اللعبة: <strong id="selectedGameName" style="color: var(--gold);"></strong>
            </p>
            <input type="text" class="input-field" id="voterName" placeholder="أدخل اسمك للتصويت" maxlength="50">
            <div style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="submitVote()">
                    <i class="fas fa-check"></i>
                    تأكيد التصويت
                </button>
                <button class="btn btn-secondary" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                    إلغاء
                </button>
            </div>
            <p style="margin-top: 20px; font-size: 0.85rem; color: rgba(255,255,255,0.6);">
                <i class="fas fa-fingerprint"></i>
                سيتم حفظ بصمة جهازك لمنع التصويت المكرر
            </p>
        </div>
    </div>

    <!-- Voters List Modal -->
    <div class="modal" id="votersModal">
        <div class="modal-content" style="max-width: 600px;">
            <h3 class="modal-title">
                <i class="fas fa-users"></i>
                المصوتون
            </h3>
            <div id="votersListContent" style="max-height: 400px; overflow-y: auto;">
                <!-- سيتم ملؤها -->
            </div>
            <button class="btn btn-secondary" onclick="closeVotersModal()" style="margin-top: 20px;">
                <i class="fas fa-times"></i>
                إغلاق
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- ========================================== -->
    <!-- === إضافة جديدة: زر لوحة التحكم === -->
    <!-- ========================================== -->
    <button class="admin-toggle-btn" onclick="toggleAdminPanel()" title="لوحة التحكم">
        <i class="fas fa-cog"></i>
    </button>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://fvgnpeogcapdifriioqa.supabase.co'; // استبدل هذا برابط مشروعك
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2Z25wZW9nY2FwZGlmcmlpb3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzQ2NTIsImV4cCI6MjEwMDU1MDY1Mn0.QJmrd1kn_mSeUft8UM4rHsfHvdTL02RQjjwaUQEm61Q'; // استبدل هذا بالمفتاح الخاص بك
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let deviceFingerprint = null;
        let selectedGameId = null;
        let currentSession = null;
        let isAdmin = false;

        // Initialize
        async function init() {
            await getDeviceFingerprint();
            await loadActiveSession();
            await loadGames();
            await loadTopVisitors();
            await trackVisit();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(checkSessionTime, 60000);
            
            // Load admin stats if panel is opened
            loadAdminStats();
        }

        // Device Fingerprinting
        async function getDeviceFingerprint() {
            try {
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                deviceFingerprint = result.visitorId;
                return deviceFingerprint;
            } catch (error) {
                console.error('Fingerprint error:', error);
                showToast('حدث خطأ في التعرف على الجهاز', 'error');
                return null;
            }
        }

        // ==========================================
        // === إضافة جديدة: دوال لوحة التحكم ===
        // ==========================================
        function toggleAdminPanel() {
            if (!isAdmin) {
                const password = prompt('أدخل كلمة مرور المسؤول:');
                if (password === '2B2024') { // يمكنك تغيير كلمة المرور هنا
                    isAdmin = true;
                    showToast('تم تسجيل الدخول كمسؤول', 'success');
                } else {
                    showToast('كلمة المرور خاطئة', 'error');
                    return;
                }
            }
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('show');
            if (panel.classList.contains('show')) {
                loadAdminStats();
            }
        }

        async function addNewGame() {
            const name = document.getElementById('newGameName').value.trim();
            const image = document.getElementById('newGameImage').value.trim();
            const desc = document.getElementById('newGameDesc').value.trim();

            if (!name) {
                showToast('الرجاء إدخال اسم اللعبة', 'error');
                return;
            }

            try {
                const { data, error } = await supabase.rpc('add_game', {
                    p_name: name,
                    p_image_url: image || null,
                    p_description: desc || null
                });

                if (error) throw error;

                showToast('تم إضافة اللعبة بنجاح!', 'success');
                document.getElementById('newGameName').value = '';
                document.getElementById('newGameImage').value = '';
                document.getElementById('newGameDesc').value = '';
                
                await loadGames();
                await loadAdminStats();
            } catch (error) {
                console.error('Add game error:', error);
                showToast('حدث خطأ أثناء إضافة اللعبة', 'error');
            }
        }

        async function createNewSession() {
            const title = document.getElementById('sessionTitle').value.trim();
            const desc = document.getElementById('sessionDesc').value.trim();
            const days = parseInt(document.getElementById('sessionDays').value) || 7;

            if (!title) {
                showToast('الرجاء إدخال عنوان الجلسة', 'error');
                return;
            }

            try {
                const { data, error } = await supabase.rpc('create_voting_session', {
                    p_title: title,
                    p_description: desc || null,
                    p_duration_days: days,
                    p_creator: 'Admin'
                });

                if (error) throw error;

                showToast('تم إنشاء جلسة التصويت بنجاح!', 'success');
                document.getElementById('sessionTitle').value = '';
                document.getElementById('sessionDesc').value = '';
                
                await loadActiveSession();
                await loadGames();
            } catch (error) {
                console.error('Create session error:', error);
                showToast('حدث خطأ أثناء إنشاء الجلسة', 'error');
            }
        }

        async function loadAdminStats() {
            try {
                // Get total votes and unique voters
                const { data: votesData } = await supabase.from('votes').select('game_id, device_fingerprint');
                const totalVotes = votesData ? votesData.length : 0;
                const uniqueVoters = votesData ? new Set(votesData.map(v => v.device_fingerprint)).size : 0;

                // Get active games
                const { data: gamesData } = await supabase.from('games').select('id').eq('is_active', true);
                const activeGames = gamesData ? gamesData.length : 0;

                document.getElementById('statTotalVotes').textContent = totalVotes;
                document.getElementById('statUniqueVoters').textContent = uniqueVoters;
                document.getElementById('statActiveGames').textContent = activeGames;
            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        // Load Active Voting Session
        async function loadActiveSession() {
            try {
                const { data, error } = await supabase
                    .from('voting_sessions')
                    .select('*')
                    .eq('is_active', true)
                    .gte('end_time', new Date().toISOString())
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .single();

                if (error) {
                    document.getElementById('countdown').innerHTML = 'لا توجد جلسة نشطة حالياً';
                    return;
                }
                
                if (data) {
                    currentSession = data;
                    document.getElementById('countdown').innerHTML = 'جاري حساب الوقت المتبقي...';
                    updateCountdown(data.end_time);
                }
            } catch (error) {
                console.error('Error loading session:', error);
            }
        }

        // Update Countdown
        function updateCountdown(endTime) {
            const interval = setInterval(() => {
                const now = new Date().getTime();
                const end = new Date(endTime).getTime();
                const distance = end - now;

                if (distance < 0) {
                    clearInterval(interval);
                    document.getElementById('countdown').innerHTML = '<i class="fas fa-hourglass-end"></i> انتهى التصويت';
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('countdown').innerHTML = 
                    `<i class="fas fa-clock"></i> الوقت المتبقي: ${days}ي ${hours}س ${minutes}د ${seconds}ث`;
            }, 1000);
        }

        // Load Games (محدث لاستخدام الإحصائيات المفصلة)
        async function loadGames() {
            try {
                // Try to use the detailed stats function if session exists
                let gamesData = [];
                
                if (currentSession) {
                    const { data: stats, error: statsError } = await supabase.rpc('get_detailed_stats', { p_session_id: currentSession.id });
                    if (!statsError && stats) {
                        gamesData = stats;
                    }
                }

                // Fallback to basic query if RPC fails or no session
                if (gamesData.length === 0) {
                    const { data: games, error } = await supabase
                        .from('games')
                        .select('*')
                        .eq('is_active', true)
                        .order('created_at', { ascending: false });
                    
                    if (error) throw error;
                    
                    // Calculate basic stats
                    const gameIds = games.map(g => g.id);
                    const { data: votes } = await supabase.from('votes').select('game_id').in('game_id', gameIds);
                    
                    gamesData = games.map(game => {
                        const voteCount = votes ? votes.filter(v => v.game_id === game.id).length : 0;
                        return {
                            game_id: game.id,
                            game_name: game.name,
                            total_votes: voteCount,
                            percentage: 0, // Will calculate below
                            unique_voters: voteCount,
                            description: game.description,
                            image_url: game.image_url
                        };
                    });
                }

                const container = document.getElementById('pollContainer');
                container.innerHTML = '';

                const totalVotes = gamesData.reduce((sum, game) => sum + (game.total_votes || 0), 0);
                const maxVotes = Math.max(...gamesData.map(g => g.total_votes || 0));

                gamesData.forEach(game => {
                    const percentage = totalVotes > 0 ? (((game.total_votes || 0) / totalVotes) * 100).toFixed(1) : 0;
                    
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    if ((game.total_votes || 0) === maxVotes && maxVotes > 0) {
                        card.classList.add('most-voted');
                    }
                    
                    card.innerHTML = `
                        <img src="${game.image_url || 'https://via.placeholder.com/400x200/1a1a2e/00d4ff?text=Game'}" 
                             alt="${game.game_name}" class="game-image" onerror="this.src='https://via.placeholder.com/400x200/1a1a2e/00d4ff?text=Game'">
                        <div class="game-name">${game.game_name}</div>
                        <p style="color: rgba(255,255,255,0.7); margin-bottom: 15px; font-size: 0.9rem;">${game.description || 'لا يوجد وصف'}</p>
                        <div class="vote-bar">
                            <div class="vote-progress" style="width: ${percentage}%">
                                ${percentage}%
                            </div>
                        </div>
                        <div class="vote-count">
                            <i class="fas fa-vote-yea"></i>
                            ${game.total_votes || 0} صوت 
                            <span style="font-size: 0.8rem; color: var(--primary);">(${game.unique_voters || 0} مصوت فريد)</span>
                        </div>
                        <button class="btn btn-secondary" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 0.9rem;"
                                onclick="event.stopPropagation(); showVotersList('${game.game_id}')">
                            <i class="fas fa-users"></i>
                            عرض المصوتين
                        </button>
                    `;

                    card.onclick = (e) => {
                        if (!e.target.closest('button')) {
                            openVoteModal(game.game_id, game.game_name);
                        }
                    };

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Error loading games:', error);
                showToast('حدث خطأ في تحميل الألعاب', 'error');
            }
        }

        // Open Vote Modal
        function openVoteModal(gameId, gameName) {
            if (!currentSession) {
                showToast('لا توجد جلسة تصويت نشطة حالياً', 'error');
                return;
            }

            selectedGameId = gameId;
            document.getElementById('selectedGameName').textContent = gameName;
            document.getElementById('voteModal').classList.add('show');
            document.getElementById('voterName').focus();
        }

        // Close Modal
        function closeModal() {
            document.getElementById('voteModal').classList.remove('show');
            document.getElementById('voterName').value = '';
            selectedGameId = null;
        }

        // Submit Vote
        async function submitVote() {
            const voterName = document.getElementById('voterName').value.trim();
            
            if (!voterName) {
                showToast('الرجاء إدخال اسمك', 'error');
                return;
            }

            if (!deviceFingerprint) {
                showToast('تعذر التعرف على الجهاز', 'error');
                return;
            }

            try {
                // Insert vote (Database UNIQUE constraint will prevent duplicates)
                const { error } = await supabase
                    .from('votes')
                    .insert({
                        game_id: selectedGameId,
                        voter_name: voterName,
                        device_fingerprint: deviceFingerprint,
                        browser_info: navigator.userAgent
                    });

                if (error) {
                    if (error.code === '23505') { // Unique violation
                        showToast('لقد قمت بالتصويت بالفعل على هذه اللعبة!', 'error');
                    } else {
                        throw error;
                    }
                    closeModal();
                    return;
                }

                // Update active users
                await supabase
                    .from('active_users')
                    .upsert({
                        device_fingerprint: deviceFingerprint,
                        voter_name: voterName,
                        total_votes: supabase.raw('total_votes + 1'),
                        last_activity: new Date().toISOString()
                    }, {
                        onConflict: 'device_fingerprint'
                    });

                showToast('تم تصويتك بنجاح! ✓', 'success');
                closeModal();
                await loadGames(); // Refresh UI
                await loadAdminStats(); // Refresh admin stats
                
            } catch (error) {
                console.error('Vote error:', error);
                showToast('حدث خطأ في التصويت', 'error');
            }
        }

        // Show Voters List
        async function showVotersList(gameId) {
            try {
                const { data: voters, error } = await supabase
                    .from('votes')
                    .select('voter_name, voted_at')
                    .eq('game_id', gameId)
                    .order('voted_at', { ascending: false });

                if (error) throw error;

                const content = document.getElementById('votersListContent');
                
                if (!voters || voters.length === 0) {
                    content.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6); padding: 20px;">لا يوجد مصوتون على هذه اللعبة بعد</p>';
                } else {
                    content.innerHTML = voters.map((v, i) => `
                        <div class="voter-item">
                            <span class="voter-name"><i class="fas fa-user-circle"></i> ${v.voter_name}</span>
                            <span class="voter-time">${new Date(v.voted_at).toLocaleString('ar-IQ')}</span>
                        </div>
                    `).join('');
                }

                document.getElementById('votersModal').classList.add('show');

            } catch (error) {
                console.error('Error loading voters:', error);
                showToast('حدث خطأ في تحميل قائمة المصوتين', 'error');
            }
        }

        function closeVotersModal() {
            document.getElementById('votersModal').classList.remove('show');
        }

        // Load Top Visitors (محدث لاستخدام View)
        async function loadTopVisitors() {
            try {
                const { data: visitors, error } = await supabase
                    .from('top_voters')
                    .select('*')
                    .limit(10);

                if (error) throw error;

                const container = document.getElementById('topVisitors');
                container.innerHTML = '';

                if (!visitors || visitors.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6); width: 100%;">لا توجد بيانات نشاط بعد</p>';
                    return;
                }

                visitors.forEach((visitor, index) => {
                    const card = document.createElement('div');
                    card.className = 'visitor-card';
                    card.innerHTML = `
                        <div class="visitor-rank">${index + 1}</div>
                        <div class="visitor-info">
                            <div class="visitor-name">${visitor.voter_name || 'زائر مجهول'}</div>
                            <div class="visitor-stats">
                                <i class="fas fa-vote-yea"></i> ${visitor.total_votes} تصويت | 
                                <i class="fas fa-gamepad"></i> ${visitor.games_voted} ألعاب
                            </div>
                        </div>
                        <div style="color: var(--gold); font-weight: 700; font-family: 'Orbitron', monospace;">
                            #${visitor.voter_rank}
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Error loading visitors:', error);
            }
        }

        // Track Visit
        async function trackVisit() {
            if (!deviceFingerprint) return;

            try {
                const { data: existingVisitor } = await supabase
                    .from('visitors')
                    .select('id')
                    .eq('device_fingerprint', deviceFingerprint)
                    .single();

                if (existingVisitor) {
                    await supabase
                        .from('visitors')
                        .update({
                            last_visit: new Date().toISOString(),
                            visit_count: supabase.raw('visit_count + 1')
                        })
                        .eq('device_fingerprint', deviceFingerprint);

                    await supabase
                        .from('active_users')
                        .upsert({
                            device_fingerprint: deviceFingerprint,
                            total_visits: supabase.raw('total_visits + 1'),
                            last_activity: new Date().toISOString()
                        }, {
                            onConflict: 'device_fingerprint'
                        });
                } else {
                    await supabase
                        .from('visitors')
                        .insert({
                            device_fingerprint: deviceFingerprint,
                            browser_info: navigator.userAgent,
                            visit_count: 1
                        });
                }

                await supabase
                    .from('page_visits')
                    .insert({
                        device_fingerprint: deviceFingerprint,
                        page_url: window.location.href
                    });

            } catch (error) {
                console.error('Track visit error:', error);
            }
        }

        // Check Session Time
        async function checkSessionTime() {
            if (!currentSession) return;

            const now = new Date();
            const endTime = new Date(currentSession.end_time);

            if (now > endTime) {
                showToast('انتهت جلسة التصويت الحالية', 'error');
                await loadActiveSession();
                await loadGames();
            }
        }

        // Update Clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-IQ', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            });
            const dateString = now.toLocaleDateString('ar-IQ', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });

            document.getElementById('clock').textContent = timeString;
            document.getElementById('dateDisplay').textContent = dateString;
        }

        // Toast Notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Close modals on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('show');
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
